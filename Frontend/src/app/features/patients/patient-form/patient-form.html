<div class="container mt-1">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4>Patient Registration Form</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-4">
            <!-- Full Name -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" formControlName="fullName" />

              <div *ngIf="submitted && f['fullName'].errors" class="invalid-feedback">
                <div *ngIf="f['fullName'].errors['required']">Full Name is required</div>
                <div *ngIf="f['fullName'].errors['minlength']">Minimum 3 characters required</div>
                <div *ngIf="f['fullName'].errors['maxlength']">Maximum 50 characters allowed</div>
              </div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" formControlName="phoneNumber" />

              <div *ngIf="submitted && f['phoneNumber'].errors" class="invalid-feedback">
                <div *ngIf="f['phoneNumber'].errors['required']">Phone number is required</div>
                <div *ngIf="f['phoneNumber'].errors['pattern']">Enter valid 10 digit number</div>
              </div>
            </div>
          </div>

          <div class="col-4">
            <!-- Gender -->
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select" formControlName="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>

              <div *ngIf="submitted && f['gender'].errors" class="invalid-feedback">
                Gender is required
              </div>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" formControlName="address" rows="2" />

              <div *ngIf="submitted && f['address'].errors" class="invalid-feedback">
                <div *ngIf="f['address'].errors['required']">Address is required</div>
                <div *ngIf="f['address'].errors['minlength']">Minimum 5 characters required</div>
              </div>
            </div>
          </div>
          <div class="col-4">
            <!-- Date of Admit -->
            <div class="mb-3">
              <label class="form-label">Date of Admit</label>
              <input
                type="datetime-local"
                class="form-control"
                formControlName="appointmentDate"
                [min]="today"
              />

              <div *ngIf="submitted && f['dateOfAdmit'].errors" class="invalid-feedback">
                Date of Admit is required
              </div>
            </div>
          </div>
        </div>
        <div class="row d-flex align-items-center justify-content-center">
          <button type="submit" class="btn btn-success w-25">Submit</button>
          <button type="reset" class="btn btn-secondary w-25">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
